<!DOCTYPE html>
<html lang="en">

<head>
    <title>Student Dashboard</title>
    <script src="config.js"></script>
    <script src="script.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
    <div class="container mx-auto p-6">
        <h1 class="text-2xl font-bold">Student Dashboard</h1>

        <h2 class="text-lg font-semibold mt-4">Available Courses</h2>
        <input type="text" id="search" placeholder="Search courses..." class="border p-2 w-full rounded mb-3">

        <table class="w-full border-collapse border">
            <thead>
                <tr class="bg-gray-200">
                    <th class="p-2 border">Course</th>
                    <th class="p-2 border">Schedule</th>
                    <th class="p-2 border">Seats</th>
                    <th class="p-2 border">Actions</th>
                </tr>
            </thead>
            <tbody id="course-list"></tbody>
        </table>

        <h2 class="text-lg font-semibold mt-6">Your Schedule</h2>
        <div id="calendar" class="border p-4 mt-2 bg-white rounded shadow"></div>
    </div>

    <script src="./js/calendar.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", loadCourses);

        async function loadCourses() {
            const res = await fetch(`${CONFIG.API_BASE_URL}/courses`);
            const courses = await res.json();
            const courseList = document.getElementById("course-list");

            courseList.innerHTML = courses.map(course => `
        <tr>
          <td class="p-2 border">${course.title}</td>
          <td class="p-2 border">${course.schedule.days.join(", ")} - ${course.schedule.time}</td>
          <td class="p-2 border">${course.seats}</td>
          <td class="p-2 border">
            <button class="bg-green-500 text-white px-2 py-1 rounded" onclick="register('${course._id}')">Register</button>
          </td>
        </tr>
      `).join("");
        }

        async function register(courseId) {
            const token = localStorage.getItem("token");
            const res = await fetch(`${CONFIG.API_BASE_URL}/register`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ studentId: "your_student_id", courseId })
            });

            const data = await res.json();
            alert(data.message || "Error registering course");
            loadCourses();
        }
    </script>
</body>

</html>
